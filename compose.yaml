name: yeti-stream
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yeti
      POSTGRES_USER: yeti
      POSTGRES_PASSWORD: yeti_local_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeti -d yeti"]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "100"
volumes:
  postgres-data:
